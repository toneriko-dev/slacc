name: Release

# package.json と Cargo.toml の version を上げて main に push してから、手動で実行する。
# 2 つの環境でビルドしたバイナリを足したコミットを作り、v<version> のタグだけを push する。
# 利用側は git の依存としてこのタグを参照するので、入れるときに Rust が要らない。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide the tag
        id: tag
        run: |
          version="$(jq -r .version package.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::package.json ($version) and Cargo.toml ($cargo_version) disagree."
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists. Bump the version first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install Rust if the runner has none
        run: |
          if ! command -v cargo > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Load the binding
        run: bun scripts/smoke.mjs index.${{ matrix.target }}.node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binding-${{ matrix.target }}
          path: index.${{ matrix.target }}.node
          if-no-files-found: error

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binding-*
          merge-multiple: true
      - name: Commit the binaries and push the tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          ls -l index.linux-x64-gnu.node index.linux-arm64-gnu.node
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force index.linux-x64-gnu.node index.linux-arm64-gnu.node
          git commit --quiet -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
